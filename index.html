<style>
:root{
  --bg:#f7f8fa;--surface:#fff;--surface2:#f0f2f5;
  --text:#1a1a2e;--text2:#6b7280;--text3:#9ca3af;
  --border:#e5e7eb;--border2:#d1d5db;
  --blue:#2563eb;--blue-light:#eff6ff;--blue-dark:#1d4ed8;
  --green:#059669;--green-light:#ecfdf5;
  --amber:#d97706;
  --red:#dc2626;--red-light:#fef2f2;
  --radius:10px;--radius-sm:6px;--radius-lg:14px;
  --shadow:0 1px 3px rgba(0,0,0,.08);--shadow-md:0 4px 12px rgba(0,0,0,.1);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.6;min-height:100vh}
.header{background:var(--surface);border-bottom:1px solid var(--border);padding:0 1.5rem;position:sticky;top:0;z-index:100;box-shadow:var(--shadow)}
.header-inner{max-width:880px;margin:0 auto;display:flex;align-items:center;gap:12px;height:56px}
.logo{font-size:15px;font-weight:700;color:var(--blue)}
.logo span{color:var(--text);font-weight:400}
.main-tabs{display:flex;margin-left:auto}
.main-tab{padding:8px 13px;font-size:13px;font-weight:500;cursor:pointer;border:none;background:none;color:var(--text2);border-bottom:2px solid transparent;height:56px;transition:color .15s}
.main-tab:hover{color:var(--text)}
.main-tab.active{color:var(--blue);border-bottom:2px solid var(--blue)}
.container{max-width:880px;margin:0 auto;padding:1.5rem}
.view{display:none}.view.active{display:block}
.sub-tabs{display:flex;gap:6px;margin-bottom:1.25rem;flex-wrap:wrap}
.sub-tab{padding:7px 16px;font-size:13px;font-weight:500;cursor:pointer;border:1px solid var(--border2);border-radius:20px;background:var(--surface);color:var(--text2);transition:all .15s}
.sub-tab:hover{border-color:var(--blue);color:var(--blue)}
.sub-tab.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.sec{display:none}.sec.active{display:block}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-group{display:flex;flex-direction:column;gap:5px;margin-bottom:.875rem}
.form-group label{font-size:12px;font-weight:600;color:var(--text2);letter-spacing:.2px}
input,select,textarea{font-size:14px;font-family:inherit;padding:9px 12px;border:1px solid var(--border2);border-radius:var(--radius-sm);background:var(--surface);color:var(--text);width:100%;transition:border .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.08)}
textarea{resize:vertical;min-height:76px;line-height:1.6}
.btn{padding:9px 18px;border-radius:var(--radius-sm);border:1px solid var(--border2);background:var(--surface);color:var(--text);cursor:pointer;font-size:14px;font-family:inherit;font-weight:500;transition:all .15s}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--blue);color:#fff;border-color:var(--blue)}
.btn.primary:hover{background:var(--blue-dark)}
.btn.sm{padding:5px 12px;font-size:13px}
.btn.xs{padding:3px 9px;font-size:12px}
.btn.danger{border-color:#fca5a5;color:var(--red)}
.btn.danger:hover{background:var(--red-light)}
.btn-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.upload-box{border:1.5px dashed var(--border2);border-radius:var(--radius);padding:1.5rem;text-align:center;cursor:pointer;color:var(--text2);font-size:13px;background:var(--surface);transition:all .15s}
.upload-box:hover{border-color:var(--blue);background:var(--blue-light)}
.upload-box.has-img{padding:4px;border-style:solid;border-color:var(--border)}
.upload-box-sm{border:1px dashed var(--border2);border-radius:var(--radius-sm);padding:.75rem;text-align:center;cursor:pointer;color:var(--text3);font-size:12px;background:var(--surface);transition:all .15s}
.upload-box-sm:hover{border-color:var(--blue);background:var(--blue-light)}
.upload-box-sm.has-img{padding:4px;border-style:solid}
.preview-img{width:100%;max-height:200px;object-fit:contain;border-radius:var(--radius);display:block}
.preview-img-sm{width:100%;max-height:130px;object-fit:contain;border-radius:var(--radius-sm);display:block}
.badge{display:inline-flex;align-items:center;font-size:11px;padding:2px 9px;border-radius:20px;font-weight:600}
.badge.중1,.badge.중2,.badge.중3{background:#d1fae5;color:#065f46}
.badge.고1{background:#dbeafe;color:#1e40af}
.badge.wait{background:#fef3c7;color:#92400e}
.badge.done{background:#d1fae5;color:#065f46}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1rem 1.25rem;margin-bottom:10px;box-shadow:var(--shadow)}
.card-header{display:flex;align-items:center;gap:7px;margin-bottom:8px;flex-wrap:wrap}
.card-name{font-weight:700;font-size:14px}
.card-meta{font-size:11px;color:var(--text3);margin-left:auto}
.card-q{font-size:14px;line-height:1.65;margin-bottom:10px;white-space:pre-wrap}
.tag{font-size:11px;background:var(--surface2);color:var(--text2);padding:2px 9px;border-radius:20px;font-weight:500}
.reply-box{background:var(--green-light);border-radius:var(--radius-sm);padding:12px 14px;margin-top:10px;border-left:3px solid var(--green)}
.reply-label{font-size:11px;color:var(--green);font-weight:700;margin-bottom:6px;letter-spacing:.3px}
.reply-text{font-size:14px;line-height:1.65;margin-bottom:8px;white-space:pre-wrap}
.reply-footer{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px;padding-top:8px;border-top:1px solid #d1fae5}
.reply-time{font-size:11px;color:var(--text3)}
.confirm-btn{font-size:12px;padding:5px 14px;border-radius:20px;border:1.5px solid var(--green);background:var(--surface);color:var(--green);cursor:pointer;font-family:inherit;font-weight:700;transition:all .15s}
.confirm-btn:hover{background:var(--green-light)}
.confirm-btn.confirmed{background:var(--green);color:#fff;border-color:var(--green)}
.confirm-box{font-size:11px;color:#065f46;background:#d1fae5;border-radius:var(--radius-sm);padding:5px 10px;margin-top:6px;font-weight:500}
.comments-wrap{margin-top:10px;border-top:1px solid var(--border);padding-top:10px}
.comment-item{display:flex;gap:8px;margin-bottom:8px;align-items:flex-start}
.comment-avatar{width:28px;height:28px;border-radius:50%;background:var(--blue-light);color:var(--blue);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.comment-avatar.teacher{background:#d1fae5;color:#065f46}
.comment-body{flex:1;background:var(--surface2);border-radius:var(--radius-sm);padding:7px 10px}
.comment-name{font-size:12px;font-weight:700;color:var(--text);margin-bottom:2px}
.comment-text{font-size:13px;color:var(--text);line-height:1.5}
.comment-meta{font-size:11px;color:var(--text3);margin-top:3px;display:flex;gap:8px;align-items:center}
.comment-input-row{display:flex;gap:8px;margin-top:8px}
.comment-input-row input{font-size:13px;padding:7px 10px;flex:1}
.img-full{width:100%;border-radius:var(--radius-sm);border:1px solid var(--border);display:block;margin:8px 0}
.t-reply-area{margin-top:12px;display:flex;flex-direction:column;gap:8px;background:var(--surface2);padding:12px;border-radius:var(--radius-sm)}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-bottom:1.25rem}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;box-shadow:var(--shadow)}
.stat-lbl{font-size:11px;font-weight:600;color:var(--text2);margin-bottom:4px;letter-spacing:.3px;text-transform:uppercase}
.stat-val{font-size:22px;font-weight:700}
.stat-sub{font-size:12px;color:var(--text3);margin-top:2px}
table{width:100%;border-collapse:collapse;font-size:14px;background:var(--surface);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
th{text-align:left;padding:10px 12px;font-size:11px;font-weight:700;color:var(--text2);background:var(--surface2);letter-spacing:.4px;text-transform:uppercase;border-bottom:1px solid var(--border)}
td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--blue-light)}
.bar-bg{background:var(--surface2);border-radius:4px;height:7px;flex:1;min-width:40px}
.bar-fill{height:7px;border-radius:4px}
.bar-fill.danger{background:var(--red)}.bar-fill.warn{background:var(--amber)}.bar-fill.ok{background:var(--green)}
.text-red{color:var(--red)}.text-green{color:var(--green)}
.sec-div{font-size:12px;font-weight:700;color:var(--text2);margin:1.25rem 0 .75rem;padding-bottom:6px;border-bottom:1px solid var(--border);letter-spacing:.5px;text-transform:uppercase}
.prob-btns{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:1rem}
.prob-btn{width:40px;height:40px;padding:0;text-align:center;font-size:13px;font-weight:600;border-radius:var(--radius-sm);border:1px solid var(--border2);background:var(--surface);color:var(--text2);cursor:pointer;transition:all .12s}
.prob-btn:hover{border-color:var(--blue);color:var(--blue)}
.prob-btn.sel{background:var(--blue);color:#fff;border-color:var(--blue)}
.sparkline{display:flex;align-items:flex-end;gap:3px;height:28px}
.sp-bar{width:8px;border-radius:2px 2px 0 0;background:var(--blue);opacity:.7}
.empty{color:var(--text3);font-size:14px;padding:3rem;text-align:center}
.notif{padding:11px 16px;border-radius:var(--radius-sm);font-size:13px;font-weight:500;margin-bottom:1rem}
.notif.ok{background:var(--green-light);color:var(--green)}
.notif.err{background:var(--red-light);color:var(--red)}
.notif.info{background:var(--blue-light);color:var(--blue)}
.pw-wrap{max-width:320px;margin:3rem auto;text-align:center;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:2rem;box-shadow:var(--shadow-md)}
.pw-title{font-size:18px;font-weight:700;margin-bottom:.5rem}
.pw-sub{font-size:13px;color:var(--text2);margin-bottom:1.5rem;line-height:1.6}
.filter-row{display:flex;gap:8px;margin-bottom:1rem;flex-wrap:wrap}
.filter-row select{width:auto;font-size:13px;padding:7px 10px}
.grade-tabs{display:flex;gap:6px;flex-wrap:wrap}
.grade-tab{padding:7px 16px;font-size:13px;font-weight:600;cursor:pointer;border:1px solid var(--border2);border-radius:20px;background:var(--surface);color:var(--text2);display:flex;align-items:center;gap:5px;transition:all .15s}
.grade-tab:hover{border-color:var(--blue);color:var(--blue)}
.grade-tab.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.grade-cnt{font-size:10px;opacity:.75}
.grade-hot{font-size:10px;background:#fef3c7;color:#92400e;padding:1px 5px;border-radius:10px;font-weight:700}
.name-modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.45);z-index:200;align-items:center;justify-content:center}
.name-modal.show{display:flex}
.name-modal-box{background:var(--surface);border-radius:var(--radius-lg);padding:2rem;width:300px;box-shadow:var(--shadow-md);text-align:center}
.name-modal-box h3{font-size:16px;margin-bottom:.5rem}
.name-modal-box p{font-size:13px;color:var(--text2);margin-bottom:1.25rem;line-height:1.6}
.loading-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(255,255,255,.7);z-index:300;align-items:center;justify-content:center;flex-direction:column;gap:12px}
.loading-overlay.show{display:flex}
.spinner{width:36px;height:36px;border:3px solid var(--border2);border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:600px){.form-row{grid-template-columns:1fr}.main-tab{padding:8px 9px;font-size:12px}.container{padding:1rem}}
</style>
</head>

<!-- 스플래시 화면 -->

<div id="splash-screen" style="position:fixed;top:0;left:0;width:100%;height:100%;background:linear-gradient(135deg,#1d4ed8 0%,#2563eb 50%,#059669 100%);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;transition:opacity .5s ease">

<style>

<div class="container">
  <div id="notif-area"></div>

      <button class="sub-tab active" onclick="switchStudent('notice')">📢 공지사항</button>
      <button class="sub-tab" onclick="switchStudent('qa')">질문 올리기</button>

    </div>
    <div id="s-qa" class="sec active">

      <div class="form-row" id="name-input-row">

          <!-- 이름 자동완성 드롭다운 -->
          <div id="name-suggestions" style="display:none;position:absolute;background:var(--surface);border:1px solid var(--border2);border-radius:var(--radius-sm);box-shadow:var(--shadow-md);z-index:50;max-height:180px;overflow-y:auto;width:100%;top:100%;left:0"></div>

      </div>

          <img id="preview" class="preview-img" style="display:none">
        </div>
        <input type="file" id="file-inp" accept="image/*" style="display:none" onchange="handleQFile(event)">

      <div class="form-group"><label>질문 내용</label>
        <textarea id="q-text" placeholder="어떤 부분이 이해가 안 되는지 구체적으로 써주세요."></textarea>
      </div>
      <div class="btn-row">
        <button class="btn primary" onclick="submitQ()" id="btn-q">질문 제출하기</button>

// ── 유틸 ──
function safeArr(v){
  if(Array.isArray(v)){
    // 빈 문자열 제거
    return v.filter(function(s){return s!==null&&s!==undefined&&String(s).trim()!=='';});
  }
  if(!v||String(v).trim()==='')return[];
  // JSON 배열 형식 시도
  try{
    var r=JSON.parse(v);
    if(Array.isArray(r))return r.filter(function(s){return s!==null&&s!==undefined&&String(s).trim()!=='';});
  }catch(e){}
  // 쉼표 구분 텍스트 형식 (구글 시트 저장 방식)
  return String(v).split(',').map(function(s){return s.trim();}).filter(function(s){return s!=='';});
}
function safeStr(v){ return v!=null?String(v):''; }
function fmt(ts){ if(!ts)return''; var d=new Date(Number(ts)); return(d.getMonth()+1)+'/'+d.getDate()+' '+pad(d.getHours())+':'+pad(d.getMinutes()); }
function pad(n){ return String(n).padStart(2,'0'); }

async function fbGetAll(col){

async function fbAdd(col,data){

}
async function fbUpdate(col,id,data){

}
async function fbDelete(col,id){

}
async function fbArrayUnion(col,id,field,val){
  var update={};
  update[field]=firebase.firestore.FieldValue.arrayUnion(val);
  await db.collection(col).doc(id).update(update);
}

    };
  });
}

// ── 이미지 압축 ──
function compressImg(file,cb){
  var reader=new FileReader();
  reader.onload=function(ev){
    var img=new Image();
    img.onload=function(){
      function tryCompress(maxW,quality){
        var c=document.createElement('canvas');
        var w=img.width,h=img.height;
        if(w>maxW){h=Math.round(h*maxW/w);w=maxW;}
        if(h>maxW){w=Math.round(w*maxW/h);h=maxW;}
        c.width=w;c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        return c.toDataURL('image/jpeg',quality);
      }
      // 글씨가 선명하게 보이도록 고화질 우선
      var b64=tryCompress(1200,0.85);
      if(b64.length>45000)b64=tryCompress(1000,0.75);
      if(b64.length>45000)b64=tryCompress(800,0.65);
      if(b64.length>45000)b64=tryCompress(600,0.55);
      if(b64.length>45000)b64=tryCompress(400,0.45);
      cb(b64);
    };
    img.onerror=function(){notify('이미지를 읽을 수 없어요.','err');};
    img.src=ev.target.result;
  };
  reader.onerror=function(){notify('파일을 읽을 수 없어요.','err');};
  reader.readAsDataURL(file);
}

function handleQFile(e){
  var file=e.target.files[0];if(!file)return;
  if(!file.type.startsWith('image/')){notify('이미지 파일만 올릴 수 있어요.','err');return;}
  compressImg(file,function(b64){
    qImgData=b64;
    var box=document.getElementById('upload-box');
    box.classList.add('has-img');
    var pv=document.getElementById('preview');
    pv.src=b64;pv.style.display='block';
    document.getElementById('upload-ph').style.display='none';
    notify('사진이 첨부되었어요! ✅');
  });
}

function handleReplyFile(e,qid){
  var file=e.target.files[0];if(!file)return;
  if(!file.type.startsWith('image/')){notify('이미지 파일만 올릴 수 있어요.','err');return;}
  notify('사진 압축 중...','info');
  compressImg(file,function(b64){
    replyImgMap[qid]=b64;
    // rbox, rprev, ph 모두 두 가지 ID 패턴 지원 (rfile-, rfile2-)
    var box=document.getElementById('rbox-'+qid);
    if(box){box.classList.add('has-img');}
    var ph=document.getElementById('rph-'+qid);
    if(ph)ph.style.display='none';
    // box 안의 .ph 클래스도 숨기기

    var pv=document.getElementById('rprev-'+qid);

// ── 질문 제출 (Firebase) ──
async function submitQ(){
  var name=document.getElementById('q-name').value.trim()||savedStudentName;
  var grade=document.getElementById('q-grade').value||savedStudentGrade;
  var week=document.getElementById('q-week').value.trim();
  var unit=document.getElementById('q-unit').value.trim();
  var text=document.getElementById('q-text').value.trim();
  if(!name||!week||!unit||!text){notify('이름, 주차, 단원, 질문 내용을 모두 입력해주세요.','err');return;}
  var btn=document.getElementById('btn-q');
  btn.disabled=true;btn.textContent='제출 중...';
  try{
    var data={name:name,grade:grade,week:week,unit:unit,question:text,ts:Date.now(),
      answered:false,reply:'',replyTs:null,hasImg:!!qImgData,imgData:qImgData||'',
      replyImgData:'',replyVideoUrl:'',confirmedBy:[],comments:[]};
    var newId=await fbAdd('questions',data);
    savedStudentName=name;savedStudentGrade=grade;
    localStorage.setItem('student_name',name);localStorage.setItem('student_grade',grade);
    if(!myName){myName=name;localStorage.setItem('my_name',name);}
    questions.unshift(Object.assign({id:newId},data));
    notify(name+' 학생의 질문이 제출되었어요! 선생님이 곧 답변해드릴게요. 😊');
    clearQForm();initStudentForm();updateAnswerBadge();
    // 해당 학년 게시판으로 자동 이동
    boardGrade=grade;
    switchMain('board');
    // 이메일 알림 (Apps Script)
    apiPost({action:'sendNotify',name:name,grade:grade,unit:unit,question:text});
  }catch(e){notify('제출 실패. 잠시 후 다시 시도해주세요.','err');console.error(e);}
  btn.disabled=false;btn.textContent='질문 제출하기';
}

  qImgData=null;document.getElementById('file-inp').value='';
  var box=document.getElementById('upload-box');box.classList.remove('has-img');
  document.getElementById('preview').style.display='none';
  document.getElementById('upload-ph').style.display='block';
}

// ── 게시판 ──
function buildGradeTabs(containerId,cur,fn){
  var el=document.getElementById(containerId);
  el.innerHTML=GRADES.map(function(g){
    var cnt=questions.filter(function(q){return q.grade===g;}).length;
    var wait=questions.filter(function(q){return q.grade===g&&!q.answered;}).length;
    return '<button class="grade-tab'+(g===cur?' active':'')+'" onclick="'+fn+'(\''+g+'\')">'
      +g+'<span class="grade-cnt">'+cnt+'</span>'
      +(wait>0&&g!==cur?'<span class="grade-hot">+'+wait+'</span>':'')
      +'</button>';
  }).join('');
}

function renderBoard(grade){
  if(grade)boardGrade=grade;
  buildGradeTabs('board-grade-tabs',boardGrade,'renderBoard');
  var list=questions.filter(function(q){return q.grade===boardGrade;});
  var done=list.filter(function(q){return q.answered;}).length;
  document.getElementById('board-stats').innerHTML=
    '<div class="stat-card"><div class="stat-lbl">전체 질문</div><div class="stat-val">'+list.length+'</div></div>'+
    '<div class="stat-card"><div class="stat-lbl">답변 대기</div><div class="stat-val" style="color:var(--amber)">'+(list.length-done)+'</div></div>'+
    '<div class="stat-card"><div class="stat-lbl">답변 완료</div><div class="stat-val" style="color:var(--green)">'+done+'</div></div>';
  var el=document.getElementById('board-content');
  if(!list.length){el.innerHTML='<p class="empty">아직 질문이 없어요</p>';return;}
  var waiting=list.filter(function(q){return !q.answered;});
  var answered=list.filter(function(q){return q.answered;});
  var html='';
  if(waiting.length)html+='<div class="sec-div">답변 대기 ('+waiting.length+')</div>'+waiting.map(function(q){return qCard(q,'b');}).join('');
  if(answered.length)html+='<div class="sec-div">답변 완료 ('+answered.length+')</div>'+answered.map(function(q){return qCard(q,'b');}).join('');
  el.innerHTML=html;
  // 내 질문에 답변 달린 것 읽음 처리 → 뱃지 제거
  if(myName){
    list.filter(function(q){return q.name===myName&&q.answered&&notifiedIds.indexOf(q.id)<0;}).forEach(function(q){
      notifiedIds.push(q.id);
    });
    saveNotifiedIds();
    updateAnswerBadge();
  }
}

// ── 카드 렌더링 ──
function qCard(q,pfx){
  var isT=(pfx==='t');

  // 학생 질문 사진
  var imgBtn=q.hasImg
    ?'<div id="'+pfx+'img-'+q.id+'" style="margin-bottom:8px"><button class="btn sm" onclick="togImg(\''+q.id+'\',\''+pfx+'\',\'q\')">📷 문제 사진 보기</button></div>'
    :'';

  // 답변 박스
  var replyHtml='';
  if(q.answered){
    var confirmedList=safeArr(q.confirmedBy);
    var iConfirmed=confirmedList.indexOf(myName)>=0;
    var totalStudents=students.filter(function(s){return s.grade===q.grade&&s.status==='active';}).length;

    var confirmSection=isT
      ?'<div style="margin-top:8px;background:'+(confirmedList.length>0?'#d1fae5':'#fef3c7')+';border-radius:var(--radius-sm);padding:8px 12px">'
        +'<div style="font-size:12px;font-weight:700;color:'+(confirmedList.length>0?'#065f46':'#92400e')+';margin-bottom:'+(confirmedList.length>0?'4px':'0')+'">'
          +(confirmedList.length>0?'✅ 확인한 학생 ('+confirmedList.length+'명'+(totalStudents?'/'+totalStudents+'명':'')+')'
          :'⏳ 아직 확인한 학생이 없어요')
        +'</div>'
        +(confirmedList.length>0
          ?'<div style="display:flex;flex-wrap:wrap;gap:4px">'
            +confirmedList.map(function(n){
              return '<span style="font-size:12px;background:#fff;color:#065f46;padding:2px 8px;border-radius:20px;border:1px solid #6ee7b7;font-weight:600">'+n+'</span>';
            }).join('')
          +'</div>'
          :'')
        +'</div>'
      :'<div style="margin-top:10px">'
        +(iConfirmed
          ?'<div style="background:#d1fae5;border-radius:var(--radius-sm);padding:10px 14px;display:flex;align-items:center;gap:8px">'
            +'<span style="font-size:20px">✅</span>'
            +'<div><div style="font-size:13px;font-weight:700;color:#065f46">답변을 확인했어요!</div>'
            +'<div style="font-size:11px;color:#059669">선생님께 확인 완료로 전달되었어요</div></div>'
            +'</div>'
          :'<button class="confirm-btn" onclick="doConfirm(\''+q.id+'\')" style="width:100%;padding:10px;font-size:14px;border-radius:var(--radius-sm)">'
            +'👀 답변 확인했어요 (클릭해주세요!)'
            +'</button>')
        +'</div>';

    var replyImgHtml='';
    if(q.replyImgData&&q.replyImgData.length>10){
      // 구글 드라이브 URL이거나 base64 둘 다 지원
      replyImgHtml='<img src="'+q.replyImgData+'" style="width:100%;max-height:280px;object-fit:contain;border-radius:8px;border:1px solid var(--border);margin-bottom:10px;display:block" onerror="this.style.display=\'none\'">';
    }

    // 영상 표시
    var replyVideoHtml='';
    if(q.replyVideoUrl&&q.replyVideoUrl.length>5){
      var embedUrl=getVideoEmbed(q.replyVideoUrl);
      if(embedUrl){
        replyVideoHtml='<div style="margin-bottom:10px">'
          +'<div style="font-size:12px;color:var(--green);font-weight:600;margin-bottom:6px">🎬 오답풀이 영상</div>'
          +'<div style="position:relative;padding-bottom:56.25%;height:0;overflow:hidden;border-radius:8px">'
            +'<iframe src="'+embedUrl+'" style="position:absolute;top:0;left:0;width:100%;height:100%;border:none;border-radius:8px" allowfullscreen></iframe>'
          +'</div>'
          +'</div>';
      } else {
        replyVideoHtml='<div style="margin-bottom:10px">'
          +'<a href="'+q.replyVideoUrl+'" target="_blank" class="btn sm" style="display:inline-flex;align-items:center;gap:6px">🎬 오답풀이 영상 보기</a>'
          +'</div>';

      +'<div class="reply-label">선생님 답변</div>'
      +replyImgHtml
      +replyVideoHtml
      +'<div class="reply-text">'+q.reply+'</div>'
      +'<div class="reply-footer">'
        +'<span class="reply-time">'+fmt(q.replyTs)+'</span>'
        +confirmSection
      +'</div>'
      +'</div>';
  }

  // 댓글
  var comments=safeArr(q.comments);
  var commentItems=comments.length>0
    ?comments.map(function(c){
      var isTeacherComment=(c.name==='선생님');
      return '<div class="comment-item">'
        +'<div class="comment-avatar'+(isTeacherComment?' teacher':'')+'">'+safeStr(c.name).charAt(0)+'</div>'
        +'<div class="comment-body">'
          +'<div class="comment-name">'+safeStr(c.name)+'</div>'
          +'<div class="comment-text">'+safeStr(c.text)+'</div>'
          +'<div class="comment-meta"><span>'+fmt(c.ts)+'</span>'
          +(isT||c.name===myName?'<button class="btn xs danger" onclick="doDeleteComment(\''+q.id+'\',\''+c.id+'\')">삭제</button>':'')

        +'</div>';

    +commentItems
    +'<div class="comment-input-row">'
      +'<input type="text" id="ci-'+q.id+'" placeholder="'+(isT?'선생님 댓글...':'댓글 달기...')+'" maxlength="200" onkeydown="if(event.key===\'Enter\')doAddComment(\''+q.id+'\')">'
      +'<button class="btn sm primary" onclick="doAddComment(\''+q.id+'\')">등록</button>'
    +'</div>'
    +'</div>';

  // 선생님 답변 입력
  var teacherActions='';
  if(isT){
    if(q.answered){
      teacherActions='<div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap">'
        +'<button class="btn sm" onclick="showEditReply(\''+q.id+'\')">✏️ 답변 수정</button>'
        +'<button class="btn sm danger" onclick="doDeleteQ(\''+q.id+'\')">삭제</button>'
        +'</div>';
    } else {
      teacherActions='<div class="t-reply-area" id="rarea-'+q.id+'">'
        +'<textarea id="ri-'+q.id+'" placeholder="오개념 교정, 풀이 힌트, 핵심 개념을 써주세요." rows="3"></textarea>'
        +'<div>'
          +'<label style="font-size:12px;color:var(--text2);font-weight:600;display:block;margin-bottom:4px">📷 답변 사진 첨부 (선택)</label>'
          +'<div class="upload-box-sm" id="rbox-'+q.id+'" onclick="document.getElementById(\'rfile-'+q.id+'\').click()" style="cursor:pointer">'
            +'<div id="rph-'+q.id+'" style="padding:8px 0;color:var(--text3);font-size:13px">클릭해서 사진 선택</div>'
            +'<img id="rprev-'+q.id+'" class="preview-img-sm" style="display:none">'
          +'</div>'
          +'<input type="file" id="rfile-'+q.id+'" accept="image/*" style="display:none" onchange="handleReplyFile(event,\''+q.id+'\')">'
        +'</div>'
        +'<div>'
          +'<label style="font-size:12px;color:var(--text2);font-weight:600;display:block;margin-bottom:4px">🎬 오답풀이 영상 링크 (선택)</label>'
          +'<input type="text" id="rvideo-'+q.id+'" placeholder="유튜브 또는 구글 드라이브 링크 붙여넣기" style="font-size:13px">'
          +'<div style="font-size:11px;color:var(--text3);margin-top:3px">예: https://youtu.be/xxx 또는 https://drive.google.com/file/d/xxx</div>'
        +'</div>'
        +'<div style="display:flex;gap:8px">'
          +'<button class="btn primary sm" onclick="doSubmitReply(\''+q.id+'\')">답변 등록</button>'
          +'<button class="btn sm danger" onclick="doDeleteQ(\''+q.id+'\')">삭제</button>'
        +'</div>'
        +'</div>';
    }
  }

  return '<div class="card" id="qcard-'+q.id+'">'
    +'<div class="card-header">'
      +'<span class="card-name">'+q.name+'</span>'
      +'<span class="badge '+q.grade+'">'+q.grade+'</span>'
      +'<span class="tag">'+q.unit+'</span>'
      +'<span class="badge '+(q.answered?'done':'wait')+'">'+(q.answered?'완료':'대기')+'</span>'
      +'<span class="card-meta">'+q.week+' · '+fmt(q.ts)+'</span>'
    +'</div>'
    +'<div class="card-q">'+q.question+'</div>'
    +imgBtn+replyHtml+commentsHtml+teacherActions
    +'</div>';

// ── 이미지 토글 ──
function togImg(id,pfx,type){
  var areaId=pfx+(type==='r'?'rimg-':'img-')+id;
  var area=document.getElementById(areaId);
  if(!area)return;
  if(area.dataset.loaded){
    area.dataset.loaded='';
    area.innerHTML='<button class="btn sm" onclick="togImg(\''+id+'\',\''+pfx+'\',\''+type+'\')">📷 '+(type==='r'?'답변 ':'')+'사진 보기</button>';
    return;
  }
  var q=questions.find(function(q){return String(q.id)===String(id);});
  var src=type==='r'?(q&&q.replyImgData):(q&&q.imgData);
  area.dataset.loaded='1';
  area.innerHTML=src&&src.length>10
    ?'<img class="img-full" src="'+src+'"><button class="btn sm" style="margin-top:4px" onclick="togImg(\''+id+'\',\''+pfx+'\',\''+type+'\')">접기</button>'
    :'<span style="font-size:13px;color:var(--text3)">이미지 없음</span>';
}

function renderTQA(grade){
  if(grade)tqaGrade=grade;
  buildGradeTabs('tqa-grade-tabs',tqaGrade,'renderTQA');
  var status=document.getElementById('tqa-status').value;
  var all=questions.filter(function(q){return q.grade===tqaGrade;});
  var list=all.slice();
  if(status==='wait')list=list.filter(function(q){return !q.answered;});
  if(status==='done')list=list.filter(function(q){return q.answered;});
  var done=all.filter(function(q){return q.answered;}).length;
  var confirmed=all.filter(function(q){return q.answered&&safeArr(q.confirmedBy).length>0;}).length;
  document.getElementById('tqa-stats').innerHTML=
    '<div class="stat-card"><div class="stat-lbl">전체</div><div class="stat-val">'+all.length+'</div></div>'+
    '<div class="stat-card"><div class="stat-lbl">대기</div><div class="stat-val" style="color:var(--amber)">'+(all.length-done)+'</div></div>'+
    '<div class="stat-card"><div class="stat-lbl">완료</div><div class="stat-val" style="color:var(--green)">'+done+'</div></div>'+
    '<div class="stat-card"><div class="stat-lbl">학생 확인</div><div class="stat-val" style="color:var(--blue)">'+confirmed+'</div></div>';
  var el=document.getElementById('tqa-list');
  if(!list.length){el.innerHTML='<p class="empty">해당하는 질문이 없어요</p>';return;}
  el.innerHTML=list.map(function(q){return qCard(q,'t');}).join('');
}

// ── 영상 URL 임베드 변환 ──
function getVideoEmbed(url){
  if(!url||url.length<5)return null;
  url=url.trim();
  // 유튜브 — watch, youtu.be, shorts, embed 등 모든 형식
  var ytMatch=url.match(/(?:youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
  if(ytMatch)return 'https://www.youtube.com/embed/'+ytMatch[1]+'?rel=0';
  // 구글 드라이브 — file/d/ 형식
  var gdMatch=url.match(/drive\.google\.com\/file\/d\/([a-zA-Z0-9_-]+)/);
  if(gdMatch)return 'https://drive.google.com/file/d/'+gdMatch[1]+'/preview';
  // 구글 드라이브 — open?id= 형식
  var gdMatch2=url.match(/drive\.google\.com\/open\?id=([a-zA-Z0-9_-]+)/);
  if(gdMatch2)return 'https://drive.google.com/file/d/'+gdMatch2[1]+'/preview';
  return null;
}

// ── 문제별 오답률 ──
function updateWeekOpts(){
  var weeks=[...new Set(hwData.map(function(d){return d.week;}))].sort();
  var sel=document.getElementById('p-week');var cur=sel.value;
  sel.innerHTML='<option value="전체">전체 주차</option>'+weeks.map(function(w){return'<option>'+w+'</option>';}).join('');
  if(weeks.indexOf(cur)>=0)sel.value=cur;
}
function renderProb(){
  updateWeekOpts();
  var grade=document.getElementById('p-grade').value;
  var week=document.getElementById('p-week').value;
  var fd=grade==='전체'?hwData:hwData.filter(function(d){return d.grade===grade;});
  if(week!=='전체')fd=fd.filter(function(d){return d.week===week;});
  var el=document.getElementById('prob-content');
  if(!fd.length){document.getElementById('prob-stats').innerHTML='';el.innerHTML='<p class="empty">데이터가 없어요</p>';return;}
  var maxP=Math.max.apply(null,fd.map(function(d){return d.total;}));
  var cnt=Array(maxP+1).fill(0),att=Array(maxP+1).fill(0);
  fd.forEach(function(d){for(var i=1;i<=d.total;i++)att[i]++;d.wrong.forEach(function(w){if(w<=maxP)cnt[w]++;});});
  var rates=[];for(var i=1;i<=maxP;i++)if(att[i]>0)rates.push({n:i,rate:Math.round(cnt[i]/att[i]*100),cnt:cnt[i],att:att[i]});
  rates.sort(function(a,b){return b.rate-a.rate;});
  var avg=rates.length?Math.round(rates.reduce(function(s,r){return s+r.rate;},0)/rates.length):0;
  var high=rates.filter(function(r){return r.rate>=50;}).length;
  var stuSet=new Set(fd.map(function(d){return d.name;}));
  document.getElementById('prob-stats').innerHTML=
    '<div class="stat-card"><div class="stat-lbl">참여 학생</div><div class="stat-val">'+stuSet.size+'명</div></div>'+
    '<div class="stat-card"><div class="stat-lbl">평균 오답률</div><div class="stat-val">'+avg+'%</div></div>'+
    '<div class="stat-card"><div class="stat-lbl">고난도 문제</div><div class="stat-val">'+high+'개</div><div class="stat-sub">오답률 50% 이상</div></div>';
  el.innerHTML='<table><thead><tr><th>번호</th><th>오답률</th><th style="width:38%">분포</th><th>오답/응시</th></tr></thead><tbody>'+
  rates.map(function(r){var cls=r.rate>=60?'danger':r.rate>=40?'warn':'ok';
    return '<tr><td style="font-weight:700">'+r.n+'번</td>'
    +'<td><span class="'+(r.rate>=60?'text-red':r.rate<30?'text-green':'')+'" style="font-weight:600">'+r.rate+'%</span></td>'
    +'<td><div style="display:flex;align-items:center;gap:8px"><div class="bar-bg"><div class="bar-fill '+cls+'" style="width:'+r.rate+'%"></div></div></div></td>'
    +'<td style="color:var(--text3);font-size:13px">'+r.cnt+'/'+r.att+'</td></tr>';}).join('')+'</tbody></table>';
}

function updateStudentSel(){
  var grade=document.getElementById('sg-grade').value;
  var fd=grade==='전체'?hwData:hwData.filter(function(d){return d.grade===grade;});
  var names=[...new Set(fd.map(function(d){return d.name;}))].sort();

  if(names.indexOf(cur)>=0)sel.value=cur;

function renderStu(){
  var name=document.getElementById('sg-stu').value;
  var el=document.getElementById('stu-content');
  if(!name){el.innerHTML='<p class="empty">학생을 선택해주세요</p>';return;}
  var fd=hwData.filter(function(d){return d.name===name;}).sort(function(a,b){return String(a.week).localeCompare(String(b.week));});
  if(!fd.length){el.innerHTML='<p class="empty">데이터가 없어요</p>';return;}
  var avg=Math.round(fd.reduce(function(s,d){return s+d.wrong.length/d.total*100;},0)/fd.length);
  var last=fd[fd.length-1];var lr=Math.round(last.wrong.length/last.total*100);
  var trend=fd.length>1?lr-Math.round(fd[fd.length-2].wrong.length/fd[fd.length-2].total*100):0;
  var spBars=fd.map(function(d){var r=Math.round(d.wrong.length/d.total*100);return'<div class="sp-bar" style="height:'+Math.max(4,r*.3)+'px"></div>';}).join('');
  el.innerHTML='<div class="stat-grid">'
    +'<div class="stat-card"><div class="stat-lbl">평균 오답률</div><div class="stat-val">'+avg+'%</div></div>'
    +'<div class="stat-card"><div class="stat-lbl">최근 오답률</div><div class="stat-val">'+lr+'%</div><div class="stat-sub '+(trend>0?'text-red':trend<0?'text-green':'')+'">'+( trend>0?'▲'+trend+'%p':trend<0?'▼'+Math.abs(trend)+'%p':'변화없음')+'</div></div>'
    +'<div class="stat-card"><div class="stat-lbl">총 제출 횟수</div><div class="stat-val">'+fd.length+'회</div></div>'
    +'<div class="stat-card"><div class="stat-lbl">주차별 추이</div><div class="sparkline" style="margin-top:4px">'+spBars+'</div></div>'
    +'</div>'
    +'<table><thead><tr><th>주차</th><th>단원</th><th>오답률</th><th>틀린 문제</th></tr></thead><tbody>'
    +fd.map(function(d){var r=Math.round(d.wrong.length/d.total*100);
      return'<tr><td>'+d.week+'</td><td>'+d.unit+'</td>'
      +'<td><span class="'+(r>=60?'text-red':r<30?'text-green':'')+'" style="font-weight:600">'+r+'%</span></td>'
      +'<td style="color:var(--text3);font-size:13px">'+(d.wrong.join(', ')||'없음')+'</td></tr>';}).join('')
    +'</tbody></table>';
}

// ── 단원별 취약점 ──
function renderUnit(){
  var grade=document.getElementById('u-grade').value;
  var fd=grade==='전체'?hwData:hwData.filter(function(d){return d.grade===grade;});
  var el=document.getElementById('unit-content');
  if(!fd.length){el.innerHTML='<p class="empty">데이터가 없어요</p>';return;}
  var units={};
  fd.forEach(function(d){
    if(!units[d.unit])units[d.unit]={wrong:0,total:0,students:new Set(),grades:{}};
    units[d.unit].wrong+=d.wrong.length;units[d.unit].total+=d.total;units[d.unit].students.add(d.name);
    if(!units[d.unit].grades[d.grade])units[d.unit].grades[d.grade]={wrong:0,total:0};
    units[d.unit].grades[d.grade].wrong+=d.wrong.length;units[d.unit].grades[d.grade].total+=d.total;
  });
  var sorted=Object.entries(units).map(function(e){return{u:e[0],rate:Math.round(e[1].wrong/e[1].total*100),cnt:e[1].students.size,grades:e[1].grades};}).sort(function(a,b){return b.rate-a.rate;});
  el.innerHTML='<table><thead><tr><th>단원</th><th>오답률</th><th style="width:35%">분포</th><th>학생 수</th></tr></thead><tbody>'+
  sorted.map(function(s){
    var cls=s.rate>=60?'danger':s.rate>=40?'warn':'ok';
    var gBadges=Object.entries(s.grades).map(function(e){return'<span class="badge '+e[0]+'" style="margin-right:3px">'+e[0]+' '+Math.round(e[1].wrong/e[1].total*100)+'%</span>';}).join('');
    return'<tr><td><div style="font-weight:600;margin-bottom:4px">'+s.u+'</div><div>'+gBadges+'</div></td>'
    +'<td><span class="'+(s.rate>=60?'text-red':s.rate<30?'text-green':'')+'" style="font-weight:700">'+s.rate+'%</span></td>'
    +'<td><div class="bar-bg"><div class="bar-fill '+cls+'" style="width:'+s.rate+'%"></div></div></td>'
    +'<td style="color:var(--text3)">'+s.cnt+'명</td></tr>';}).join('')+'</tbody></table>';
}

function sendBrowserNotif(title, body, icon){
  if(!('Notification' in window))return;
  if(Notification.permission==='granted'){
    try{
      new Notification(title,{
        body: body,
        icon: icon||'https://cdn.jsdelivr.net/gh/twitter/twemoji@14/assets/72x72/2697.png',
        badge: 'https://cdn.jsdelivr.net/gh/twitter/twemoji@14/assets/72x72/2697.png',
        tag: title,
        renotify: true
      });
    }catch(e){}
  }
}

async function requestNotifPermission(){
  if(!('Notification' in window))return;
  if(Notification.permission==='default'){
    var perm = await Notification.requestPermission();
    if(perm==='granted'){
      notify('알림이 허용되었어요! 선생님 답변이 오면 알려드릴게요 🔔');

// 학생용 — 내 질문에 새 답변이 달렸는지 체크
function startStudentPoll(){
  if(studentPollTimer)clearInterval(studentPollTimer);
  studentPollTimer=setInterval(function(){
    if(!myName)return;
    fbGetAll('questions').then(function(res){
      var myQs=parseQ(res).filter(function(q){return q.name===myName&&q.answered;});
      myQs.forEach(function(q){
        if(notifiedIds.indexOf(q.id)<0){
          notifiedIds.push(q.id);
          saveNotifiedIds();
          sendBrowserNotif(
            '⚗️ 하연통합과학학원 — 선생님 답변 도착!',
            q.unit+' 질문에 선생님 답변이 달렸어요. 확인해 보세요!'
          );
          notify('📬 선생님이 답변을 달아주셨어요!');
          // 질문 탭으로 이동

// ── 숙제 체크 ──
function renderHWCheck(){
  // 숙제 데이터 없으면 먼저 불러오기
  if(!hwData.length&&!students.length){
    loadHWAndStudents().then(function(){renderHWCheck();});
    return;
  }
  var grade=document.getElementById('hw-grade').value;
  var week=document.getElementById('hw-week-filter').value.trim();
  var activeStudents=students.filter(function(s){return s.status==='active';});
  if(grade!=='전체')activeStudents=activeStudents.filter(function(s){return s.grade===grade;});
  var el=document.getElementById('hw-check-content');
  var statsEl=document.getElementById('hw-check-stats');
  if(!activeStudents.length){
    statsEl.innerHTML='';
    el.innerHTML='<p class="empty">재원 학생이 없어요. 학생 관리에서 먼저 학생을 등록해 주세요.</p>';
    return;
  }
  var weeks=week?[week]:[...new Set(hwData.map(function(d){return d.week;}))].sort().reverse().slice(0,5);
  if(!weeks.length){
    statsEl.innerHTML='';
    el.innerHTML='<p class="empty">주차를 입력하거나 오답 데이터가 있어야 해요.</p>';
    return;
  }
  var targetWeek=weeks[0];
  var submitted=hwData.filter(function(d){return d.week===targetWeek&&(grade==='전체'||d.grade===grade);});
  var submittedNames=submitted.map(function(d){return d.name;});
  var total=activeStudents.length;
  var doneCount=activeStudents.filter(function(s){return submittedNames.indexOf(s.name)>=0;}).length;
  statsEl.innerHTML=
    '<div class="stat-card"><div class="stat-lbl">전체 학생</div><div class="stat-val">'+total+'명</div></div>'+
    '<div class="stat-card"><div class="stat-lbl">제출 완료</div><div class="stat-val" style="color:var(--green)">'+doneCount+'명</div></div>'+
    '<div class="stat-card"><div class="stat-lbl">미제출</div><div class="stat-val" style="color:var(--red)">'+(total-doneCount)+'명</div></div>';
  var weekBtns=weeks.map(function(w){
    return '<button class="btn sm'+(w===targetWeek?' primary':'')+'" onclick="document.getElementById(\'hw-week-filter\').value=\''+w+'\';renderHWCheck()">'+w+'</button>';
  }).join('');
  el.innerHTML='<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:1rem">'+weekBtns+'</div>'
    +'<div style="font-size:13px;color:var(--text2);margin-bottom:10px;font-weight:600">📋 '+targetWeek+' 숙제 제출 현황</div>'
    +'<table><thead><tr><th>학년</th><th>이름</th><th>제출 여부</th><th>오답률</th></tr></thead><tbody>'
    +activeStudents.map(function(s){
      var sub=submitted.find(function(d){return d.name===s.name;});
      var done=!!sub;
      var rate=sub?Math.round(sub.wrong.length/sub.total*100):null;
      return '<tr>'
        +'<td><span class="badge '+s.grade+'">'+s.grade+'</span></td>'
        +'<td style="font-weight:500">'+s.name+'</td>'
        +'<td>'+(done
          ?'<span style="color:var(--green);font-weight:600">✅ 제출</span>'
          :'<span style="color:var(--red);font-weight:600">❌ 미제출</span>')+'</td>'
        +'<td>'+(rate!==null?'<span style="font-weight:600;color:'+(rate>=60?'var(--red)':rate<30?'var(--green)':'inherit')+'">'+rate+'%</span>':'-')+'</td>'
        +'</tr>';
    }).join('')
    +'</tbody></table>';
}

  if(status!=='전체')fd=fd.filter(function(s){return s.status===status;});
  var active=students.filter(function(s){return s.status==='active';}).length;
  var pending=students.filter(function(s){return s.status==='pending';}).length;
  document.getElementById('mgmt-stats').innerHTML=
    '<div class="stat-card"><div class="stat-lbl">전체 등록</div><div class="stat-val">'+students.length+'명</div></div>'+
    '<div class="stat-card"><div class="stat-lbl">재원</div><div class="stat-val" style="color:var(--green)">'+active+'명</div></div>'+
    '<div class="stat-card"><div class="stat-lbl">신청 대기</div><div class="stat-val" style="color:var(--amber)">'+pending+'명</div></div>';
  var el=document.getElementById('mgmt-list');
  if(!fd.length){el.innerHTML='<p class="empty">등록된 학생이 없어요</p>';return;}

    var hw=hwData.filter(function(d){return d.name===s.name;});
    var qs=questions.filter(function(q){return q.name===s.name;});
    var avgRate=hw.length?Math.round(hw.reduce(function(acc,d){return acc+d.wrong.length/d.total*100;},0)/hw.length):null;
    var statusBadge=s.status==='active'
      ?'<span style="font-size:11px;background:#d1fae5;color:#065f46;padding:2px 8px;border-radius:20px;font-weight:600">재원</span>'

      :'<span style="font-size:11px;background:var(--surface2);color:var(--text3);padding:2px 8px;border-radius:20px;font-weight:600">퇴원</span>';
    return '<div class="card" style="cursor:pointer" onclick="showStudentDetail(\''+s.id+'\')">'

        +'<div style="font-size:12px;color:var(--text2)">👨‍👩‍👧 '+safeStr(s.parentPhone)+'</div>'

// 이미 이름 저장된 학생은 바로 알림 시작
if(myName){
  requestNotifPermission().then(function(){startStudentPoll();});
}

// ── Service Worker 등록 (PWA + 푸시) ──
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('/sw.js').then(function(reg){
    console.log('SW 등록 완료');
  }).catch(function(err){
    console.log('SW 등록 실패:', err);
  });
}

// ── OneSignal 사용자 태그 설정 ──
function setOneSignalTags(){
  if(typeof OneSignal === 'undefined')return;
  if(myName){
    // 학생 태그 설정
    window.OneSignalDeferred.push(function(OneSignal){
      OneSignal.User.addTags({name: myName, role: 'student'});
    });
  }
}
function setTeacherTag(){
  if(typeof OneSignal === 'undefined')return;
  window.OneSignalDeferred.push(function(OneSignal){
    OneSignal.User.addTags({role: 'teacher'});
  });
}
</script>
</body>
</html>
